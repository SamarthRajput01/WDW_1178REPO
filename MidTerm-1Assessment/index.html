<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Player</title>
</head>
<body>

    <!-- Main Heading -->
    <h1 style="color: blue; text-align: center;">Multimedia Player</h1>

    <!-- Audio Section -->
    <h2 style="background-color: pink;">Audio Section</h2>
    <audio controls>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <!-- Video Section -->
    <h2 style="background-color: pink;">Video Section</h2>
    <video controls width="320" height="180">
        <source src="college.mp4" type="video/mp4">
    </video>

</body>
</html>
